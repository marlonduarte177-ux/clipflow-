# Despliega la infraestructura en AWS con CDK.
# Se ejecuta a mano: GitHub > Actions > Deploy > Run workflow.
# Entra a AWS con OIDC (credenciales temporales), sin claves guardadas.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Entorno a desplegar
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write # necesario para OIDC
  contents: read

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # El environment de GitHub limita qué ramas/personas pueden desplegar
    # y es lo que el rol de AWS exige para dejar entrar.
    environment: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Identidad OIDC que GitHub presenta a AWS (diagnóstico)
        # Muestra solo datos públicos del token (no el token). Si AWS rechaza el rol,
        # "sub" debe coincidir con la condición del rol en infrastructure/bootstrap.
        run: |
          curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(t+"="*(-len(t)%4))); print(json.dumps({k:c.get(k) for k in ["sub","aud","repository","environment","ref"]},indent=2))'
      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: cdk deploy
        working-directory: infrastructure
        # Correo de alertas, presupuesto y pagos (Paddle): variables del environment en GitHub
        # (pueden estar vacías). Son valores públicos; la clave secreta de Paddle está en AWS.
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          BILLING_ENABLED: ${{ vars.BILLING_ENABLED }}
          # Correos exentos de pagar: como secreto, para que no aparezcan en los registros públicos.
          BILLING_FREE_EMAILS: ${{ secrets.BILLING_FREE_EMAILS }}
          PADDLE_ENVIRONMENT: ${{ vars.PADDLE_ENVIRONMENT }}
          PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          PADDLE_PRICE_TRIAL_FEE: ${{ vars.PADDLE_PRICE_TRIAL_FEE }}
          PADDLE_PRICE_BASIC_TRIAL: ${{ vars.PADDLE_PRICE_BASIC_TRIAL }}
          PADDLE_PRICE_BASIC: ${{ vars.PADDLE_PRICE_BASIC }}
          PADDLE_PRICE_PRO: ${{ vars.PADDLE_PRICE_PRO }}
          PADDLE_PRICE_MAX: ${{ vars.PADDLE_PRICE_MAX }}
          PADDLE_DISCOUNT_TRIAL: ${{ vars.PADDLE_DISCOUNT_TRIAL }}
          PADDLE_PORTAL_URL: ${{ vars.PADDLE_PORTAL_URL }}
        run: >-
          npx cdk deploy --all -c stage=${{ inputs.stage }}
          -c alertEmail="$ALERT_EMAIL" -c monthlyBudgetUsd="$MONTHLY_BUDGET_USD"
          -c billingEnabled="$BILLING_ENABLED" -c billingFreeEmails="$BILLING_FREE_EMAILS"
          -c paddleEnvironment="$PADDLE_ENVIRONMENT" -c paddleClientToken="$PADDLE_CLIENT_TOKEN"
          -c paddlePriceTrialFee="$PADDLE_PRICE_TRIAL_FEE" -c paddlePriceBasicTrial="$PADDLE_PRICE_BASIC_TRIAL"
          -c paddlePriceBasic="$PADDLE_PRICE_BASIC" -c paddlePricePro="$PADDLE_PRICE_PRO"
          -c paddlePriceMax="$PADDLE_PRICE_MAX" -c paddlePortalUrl="$PADDLE_PORTAL_URL"
          -c paddleDiscountTrial="$PADDLE_DISCOUNT_TRIAL"
          --require-approval never --outputs-file cdk-outputs.json
      - name: Resumen
        working-directory: infrastructure
        run: |
          {
            echo "## Despliegue ${{ inputs.stage }} completado"
            echo ""
            echo "Valores públicos (no son secretos):"
            echo '```json'
            cat cdk-outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
